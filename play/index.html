<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원소 마법사의 탑 : 스테이지 1</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  body {
    background-color: #1c1e24;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    overflow: hidden;
  }
  #game-wrapper {
    position: relative;
    width: 960px;
    height: 600px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
    border-radius: 10px;
    overflow: hidden;
    background: #6e7375;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(24, 26, 32, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f8f5e6;
    text-align: center;
    padding: 28px;
    z-index: 10;
  }
  .hidden {
    display: none !important;
  }
  h1 {
    font-size: 36px;
    margin-bottom: 10px;
    color: #ffd166;
    text-shadow: 0 3px 10px rgba(0,0,0,0.6);
  }
  .subtitle {
    font-size: 15px;
    color: #d0d4dc;
    margin-bottom: 22px;
  }
  .element-select {
    display: flex;
    gap: 14px;
    margin-bottom: 22px;
  }
  .el-btn {
    background: #2c303a;
    border: 3px solid #4e5463;
    border-radius: 12px;
    padding: 12px 18px;
    color: #fff;
    cursor: pointer;
    transition: 0.15s;
    min-width: 126px;
  }
  .el-btn:hover {
    transform: translateY(-3px);
  }
  .el-btn.selected {
    border-color: #ffd166;
    background: #3a404f;
    box-shadow: 0 0 16px rgba(255, 209, 102, 0.45);
  }
  .el-icon {
    font-size: 28px;
    display: block;
    margin-bottom: 4px;
  }
  .el-name {
    font-weight: bold;
    font-size: 16px;
  }
  .el-desc {
    font-size: 12px;
    color: #b8bec9;
    margin-top: 3px;
  }
  .controls-box {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    padding: 14px 24px;
    margin-bottom: 22px;
    font-size: 14px;
    line-height: 1.75;
    text-align: left;
  }
  .key-badge {
    display: inline-block;
    background: #444b59;
    border: 1px solid #757f94;
    border-radius: 5px;
    padding: 1px 7px;
    font-weight: bold;
    color: #ffd166;
    font-size: 13px;
  }
  .action-btn {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 40px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
    transition: 0.15s;
  }
  .action-btn:hover {
    transform: scale(1.04);
    filter: brightness(1.08);
  }
  .result-stats {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 16px 32px;
    margin: 18px 0 24px;
    font-size: 17px;
    line-height: 1.9;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas" width="960" height="600"></canvas>

  <!-- 시작 화면 -->
  <div id="start-screen" class="overlay">
    <h1>🧙‍♂️ 원소 마법사의 탑</h1>
    <p class="subtitle">시작할 기본 마법 속성을 선택하고 탑을 정복하세요!</p>

    <div class="element-select" id="element-buttons">
      <button class="el-btn selected" data-el="water">
        <span class="el-icon">💧</span>
        <span class="el-name">물 마법</span>
        <span class="el-desc">불에 강함 / 번개에 약함</span>
      </button>
      <button class="el-btn" data-el="fire">
        <span class="el-icon">🔥</span>
        <span class="el-name">불 마법</span>
        <span class="el-desc">풀에 강함 / 물에 약함</span>
      </button>
      <button class="el-btn" data-el="lightning">
        <span class="el-icon">⚡</span>
        <span class="el-name">번개 마법</span>
        <span class="el-desc">물·바위에 강함 / 풀에 약함</span>
      </button>
      <button class="el-btn" data-el="grass">
        <span class="el-icon">🌿</span>
        <span class="el-name">풀 마법</span>
        <span class="el-desc">번개·바위에 강함 / 불에 약함</span>
      </button>
      <button class="el-btn" data-el="rock">
        <span class="el-icon">🪨</span>
        <span class="el-name">바위 마법</span>
        <span class="el-desc">불에 강함 / 물·풀에 약함</span>
      </button>
    </div>

    <div class="controls-box">
      <div><span class="key-badge">W A S D</span> 이동 &nbsp;|&nbsp; <span class="key-badge">Space</span> 무적 대쉬</div>
      <div><span class="key-badge">마우스 좌클릭</span> 기본 마법 발사 &nbsp;|&nbsp; <span class="key-badge">마우스 우클릭</span> 속성 특수 스킬</div>
      <div><span class="key-badge">E</span> / <span class="key-badge">Q</span> 마법서 방에서 배운 속성 마법 전환</div>
    </div>

    <button class="action-btn" id="start-btn">게임 시작</button>
  </div>

  <!-- 게임오버 / 결과 화면 -->
  <div id="end-screen" class="overlay hidden">
    <h1 id="end-title">💀 쓰러졌습니다...</h1>
    <p class="subtitle" id="end-subtitle">마법사의 체력이 모두 소진되었습니다.</p>
    <div class="result-stats" id="result-stats"></div>
    <button class="action-btn" id="restart-btn">다시 하기</button>
  </div>
</div>

<script>
// ============================================================================
// [설정값] 처음 하는 사람도 즐길 수 있게 정한 밸런스 숫자 모음
// ============================================================================
const CONFIG = {
  // 화면 및 방 크기 설정
  CANVAS_WIDTH: 960,
  CANVAS_HEIGHT: 600,
  WALL_THICKNESS: 42,

  // 플레이어 설정
  PLAYER_MAX_HP: 100,
  PLAYER_SPEED: 240,
  PLAYER_RADIUS: 18,
  DASH_SPEED: 650,
  DASH_DURATION: 0.18,
  DASH_COOLDOWN: 1.15,
  INVULN_AFTER_HIT: 0.65,

  // 공격 및 상성 설정
  PRIMARY_COOLDOWN: 0.28,
  PRIMARY_SPEED: 520,
  PRIMARY_DAMAGE: 20,
  SKILL_COOLDOWN: 2.0,
  SKILL_BASE_DAMAGE: 36,
  WEAKNESS_MULTIPLIER: 1.5, // 약점 공격 배율
  RESIST_MULTIPLIER: 0.5,   // 내성 공격 배율

  // 스테이지(N-M) 및 몬스터 설정
  ROOMS_PER_SUBSTAGE: 5,    // 방 5개 클리어마다 M 1 증가, M=5면 보스 등장
  MONSTER_COUNT_MIN: 3,     // 일반 전투 방 최소 몬스터 수
  MONSTER_COUNT_MAX: 7,     // 일반 전투 방 최대 몬스터 수
  MONSTER_BASE_HP: 55,
  MONSTER_HP_PER_SUBSTAGE: 10,
  MONSTER_HP_PER_STAGE: 25,
  MONSTER_SPEED: 105,
  MONSTER_DETECT_RANGE: 360,
  MONSTER_CONTACT_DAMAGE: 14,

  // 예티 보스 설정
  BOSS_MAX_HP: 450,
  BOSS_HP_PER_STAGE: 140,
  BOSS_SPEED: 88,
  BOSS_SHOT_COOLDOWN: 1.65,
  BOSS_BULLET_SPEED: 250,
  BOSS_DAMAGE: 18,

  // 장애물 배치 설정 (겹침 방지 여유 거리)
  OBSTACLE_MIN_COUNT: 4,
  OBSTACLE_MAX_COUNT: 6,
  OBSTACLE_PADDING: 34,

  // N이 1 증가할 때마다 순환하는 맵 배경 테마 목록
  STAGE_THEMES: [
    {
      name: '1장 · 양피지 성채',
      floor: '#f4eed0',
      floorDot: '#e3dbb6',
      wall: '#6e7375',
      wallInner: '#565a5c',
      bossTileA: '#d4d9dd',
      bossTileB: '#c5ccd1',
      bossLine: '#8d959c'
    },
    {
      name: '2장 · 에메랄드 숲유적',
      floor: '#dff0d8',
      floorDot: '#c4dfc0',
      wall: '#4d6652',
      wallInner: '#3b4f3f',
      bossTileA: '#c6decb',
      bossTileB: '#b5d1bb',
      bossLine: '#729479'
    },
    {
      name: '3장 · 용암 화산 지하궁전',
      floor: '#f5ded6',
      floorDot: '#e3c0b3',
      wall: '#5c3b38',
      wallInner: '#452a28',
      bossTileA: '#d9c1bd',
      bossTileB: '#c9ada8',
      bossLine: '#8c6660'
    },
    {
      name: '4장 · 심해 수정 신전',
      floor: '#d8ebf5',
      floorDot: '#bad7e8',
      wall: '#3c566e',
      wallInner: '#2b4054',
      bossTileA: '#bfd5e3',
      bossTileB: '#aec7d6',
      bossLine: '#6a8ba1'
    },
    {
      name: '5장 · 자수정 천공탑',
      floor: '#ebe0f5',
      floorDot: '#d6c4e8',
      wall: '#58446e',
      wallInner: '#423154',
      bossTileA: '#d4c6e3',
      bossTileB: '#c5b4d6',
      bossLine: '#87729c'
    },
    {
      name: '6장 · 만년설 얼음 요새',
      floor: '#e6f4f7',
      floorDot: '#cce3e8',
      wall: '#546b75',
      wallInner: '#3f5259',
      bossTileA: '#cfe0e6',
      bossTileB: '#bfd3db',
      bossLine: '#7d98a3'
    }
  ]
};

// ============================================================================
// 5대 원소 정보 및 상성 정의
// ============================================================================
const ELEMENTS = {
  water: {
    id: 'water',
    name: '물',
    icon: '💧',
    color: '#3b82f6',
    lightColor: '#93c5fd',
    skillName: '관통 해일파',
    strongAgainst: ['fire', 'rock'],
    weakAgainst: ['lightning', 'grass']
  },
  fire: {
    id: 'fire',
    name: '불',
    icon: '🔥',
    color: '#ef4444',
    lightColor: '#fca5a5',
    skillName: '5연발 화염 부채',
    strongAgainst: ['grass'],
    weakAgainst: ['water', 'rock']
  },
  lightning: {
    id: 'lightning',
    name: '번개',
    icon: '⚡',
    color: '#eab308',
    lightColor: '#fef08a',
    skillName: '초고속 2연발 번개창',
    strongAgainst: ['water', 'rock'],
    weakAgainst: ['grass']
  },
  grass: {
    id: 'grass',
    name: '풀',
    icon: '🌿',
    color: '#22c55e',
    lightColor: '#86efac',
    skillName: '8방향 가시폭풍',
    strongAgainst: ['water', 'lightning', 'rock'],
    weakAgainst: ['fire']
  },
  rock: {
    id: 'rock',
    name: '바위',
    icon: '🪨',
    color: '#92400e',
    lightColor: '#d6b899',
    skillName: '거대 룬 바위탄',
    strongAgainst: ['fire'],
    weakAgainst: ['water', 'grass', 'lightning']
  }
};
const ELEMENT_KEYS = Object.keys(ELEMENTS);

// 상성 배율 계산 함수
function getElementMultiplier(atkEl, defEl) {
  const atk = ELEMENTS[atkEl];
  if (!atk || !defEl) return 1.0;
  if (atk.strongAgainst.includes(defEl)) return CONFIG.WEAKNESS_MULTIPLIER;
  if (atk.weakAgainst.includes(defEl)) return CONFIG.RESIST_MULTIPLIER;
  return 1.0;
}

// ============================================================================
// 게임 전역 상태 및 DOM 연결
// ============================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const endTitle = document.getElementById('end-title');
const endSubtitle = document.getElementById('end-subtitle');
const resultStats = document.getElementById('result-stats');

let selectedStartElement = 'water';
let gameState = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
let lastTime = 0;

// 키보드 및 마우스 입력 상태
const keys = {};
const mouse = {
  x: CONFIG.CANVAS_WIDTH / 2,
  y: CONFIG.CANVAS_HEIGHT / 2,
  leftDown: false
};

// 플레이어 상태
const player = {
  x: 480,
  y: 340,
  hp: CONFIG.PLAYER_MAX_HP,
  maxHp: CONFIG.PLAYER_MAX_HP,
  unlockedElements: ['water'],
  currentSlotIndex: 0,
  primaryTimer: 0,
  skillTimer: 0,
  dashTimer: 0,
  dashCooldownTimer: 0,
  dashDirX: 0,
  dashDirY: -1,
  invulnTimer: 0,
  walkAnim: 0
};

// 현재 방 및 스테이지(N-M) 상태
const roomState = {
  stageN: 1,               // 스테이지 N (보스 처치 시 1 증가)
  stageM: 1,               // 서브 스테이지 M (방 5개 클리어 시 1 증가, 5면 보스전)
  clearedInSubStage: 0,    // 현재 M에서 클리어한 일반 방 수 (0 ~ 4)
  totalCombatCleared: 0,   // 누적 일반 방 클리어 수
  totalKills: 0,           // 누적 처치 몬스터 수
  bossKills: 0,            // 누적 보스 처치 수
  type: 'COMBAT',          // 'COMBAT' | 'SPELLBOOK' | 'BOSS'
  cleared: false,
  doors: [],
  obstacles: [],
  monsters: [],
  boss: null,
  spellbook: null,
  projectiles: [],
  enemyProjectiles: [],
  particles: [],
  floatingTexts: [],
  floorDetails: []
};

// ============================================================================
// 시작 화면 속성 선택 및 버튼 이벤트
// ============================================================================
document.querySelectorAll('.el-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.el-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedStartElement = btn.dataset.el;
  });
});

document.getElementById('start-btn').addEventListener('click', startNewGame);
document.getElementById('restart-btn').addEventListener('click', () => {
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  gameState = 'START';
});

// 브라우저 스크롤 방지 및 키보드 즉시 입력 처리
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', ' '].includes(e.key)) {
    e.preventDefault();
  }
  const code = e.code;
  keys[code] = true;

  if (gameState !== 'PLAYING') return;

  // Space: 무적 대쉬
  if (code === 'Space' && player.dashCooldownTimer <= 0 && player.dashTimer <= 0) {
    triggerDash();
  }
  // E / Q: 습득한 마법 속성 전환
  if (code === 'KeyE') {
    cycleElement(-1);
  } else if (code === 'KeyQ') {
    cycleElement(1);
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (CONFIG.CANVAS_WIDTH / rect.width);
  mouse.y = (e.clientY - rect.top) * (CONFIG.CANVAS_HEIGHT / rect.height);
});

canvas.addEventListener('mousedown', (e) => {
  if (gameState !== 'PLAYING') return;
  if (e.button === 0) {
    mouse.leftDown = true;
    tryPrimaryAttack();
  } else if (e.button === 2) {
    trySkillAttack();
  }
});

window.addEventListener('mouseup', (e) => {
  if (e.button === 0) mouse.leftDown = false;
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================================================================
// 게임 시작 및 방 생성 로직
// ============================================================================
function startNewGame() {
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');

  player.hp = CONFIG.PLAYER_MAX_HP;
  player.maxHp = CONFIG.PLAYER_MAX_HP;
  player.unlockedElements = [selectedStartElement];
  player.currentSlotIndex = 0;
  player.primaryTimer = 0;
  player.skillTimer = 0;
  player.dashTimer = 0;
  player.dashCooldownTimer = 0;
  player.invulnTimer = 0;

  roomState.stageN = 1;
  roomState.stageM = 1;
  roomState.clearedInSubStage = 0;
  roomState.totalCombatCleared = 0;
  roomState.totalKills = 0;
  roomState.bossKills = 0;

  gameState = 'PLAYING';
  enterRoom('COMBAT', 'bottom');
}

function getCurrentElement() {
  return player.unlockedElements[player.currentSlotIndex] || selectedStartElement;
}

function getCurrentTheme() {
  const idx = (roomState.stageN - 1) % CONFIG.STAGE_THEMES.length;
  return CONFIG.STAGE_THEMES[idx];
}

function cycleElement(dir) {
  const len = player.unlockedElements.length;
  if (len <= 1) return;
  player.currentSlotIndex = (player.currentSlotIndex + dir + len) % len;
  const el = ELEMENTS[getCurrentElement()];
  addFloatingText(player.x, player.y - 42, `${el.icon} ${el.name} 마법 장착!`, el.color);
}

// 문 위치 좌표 계산 (위, 왼쪽, 오른쪽)
function getDoorRect(side) {
  const w = CONFIG.CANVAS_WIDTH;
  const h = CONFIG.CANVAS_HEIGHT;
  if (side === 'top') return { side: 'top', x: w / 2 - 42, y: 6, w: 84, h: 42, spawnX: w / 2, spawnY: 115 };
  if (side === 'left') return { side: 'left', x: 6, y: h / 2 - 42, w: 42, h: 84, spawnX: 115, spawnY: h / 2 };
  return { side: 'right', x: w - 48, y: h / 2 - 42, w: 42, h: 84, spawnX: w - 115, spawnY: h / 2 };
}

// 원형 충돌 판정 유틸
function circlesOverlap(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2;
  const dy = y1 - y2;
  return dx * dx + dy * dy < (r1 + r2) * (r1 + r2);
}

// 안전한 빈 바닥 격자 좌표 목록 생성 (장애물·벽·플레이어와 절대 겹치지 않음)
function buildSafeFloorGrid(extraClearRadius = 28) {
  const safePoints = [];
  const wall = CONFIG.WALL_THICKNESS;
  for (let gx = wall + 75; gx <= CONFIG.CANVAS_WIDTH - wall - 75; gx += 58) {
    for (let gy = wall + 85; gy <= CONFIG.CANVAS_HEIGHT - wall - 75; gy += 58) {
      // 플레이어 시작 위치와 너무 가까우면 제외
      if (circlesOverlap(gx, gy, extraClearRadius, player.x, player.y, 115)) continue;

      // 문 입구와 겹치면 제외
      let nearDoor = false;
      for (const side of ['top', 'left', 'right']) {
        const d = getDoorRect(side);
        if (circlesOverlap(gx, gy, extraClearRadius, d.x + d.w / 2, d.y + d.h / 2, 75)) {
          nearDoor = true;
          break;
        }
      }
      if (nearDoor) continue;

      // 설치된 장애물과 겹치면 제외
      let hitObs = false;
      for (const obs of roomState.obstacles) {
        if (circlesOverlap(gx, gy, extraClearRadius, obs.x, obs.y, obs.radius + 12)) {
          hitObs = true;
          break;
        }
      }
      if (!hitObs) {
        safePoints.push({ x: gx, y: gy });
      }
    }
  }
  return safePoints;
}

// 맵 곳곳에 겹치지 않는 장애물 배치
function generateObstacles(isBossRoom) {
  roomState.obstacles = [];
  const count = isBossRoom
    ? 4
    : Math.floor(Math.random() * (CONFIG.OBSTACLE_MAX_COUNT - CONFIG.OBSTACLE_MIN_COUNT + 1)) + CONFIG.OBSTACLE_MIN_COUNT;

  const wall = CONFIG.WALL_THICKNESS;
  const doorZones = [
    { x: CONFIG.CANVAS_WIDTH / 2, y: 80, r: 95 },
    { x: 80, y: CONFIG.CANVAS_HEIGHT / 2, r: 95 },
    { x: CONFIG.CANVAS_WIDTH - 80, y: CONFIG.CANVAS_HEIGHT / 2, r: 95 },
    { x: CONFIG.CANVAS_WIDTH / 2, y: CONFIG.CANVAS_HEIGHT - 80, r: 95 }
  ];

  let attempts = 0;
  while (roomState.obstacles.length < count && attempts < 250) {
    attempts++;
    const radius = Math.random() < 0.5 ? 24 : 30;
    const x = wall + 95 + Math.random() * (CONFIG.CANVAS_WIDTH - (wall + 95) * 2);
    const y = wall + 105 + Math.random() * (CONFIG.CANVAS_HEIGHT - (wall + 105) * 2);

    // 플레이어 초기 위치 회피
    if (circlesOverlap(x, y, radius, player.x, player.y, 110)) continue;
    // 보스 중앙 스폰 위치 회피
    if (isBossRoom && circlesOverlap(x, y, radius, CONFIG.CANVAS_WIDTH / 2, 230, 135)) continue;
    // 문 출입구 회피
    if (doorZones.some(dz => circlesOverlap(x, y, radius, dz.x, dz.y, dz.r))) continue;
    // 다른 장애물과 이미지가 겹치지 않도록 여유 거리 확보
    if (roomState.obstacles.some(o => circlesOverlap(x, y, radius, o.x, o.y, o.radius + CONFIG.OBSTACLE_PADDING))) continue;

    roomState.obstacles.push({
      x,
      y,
      radius,
      kind: Math.random() < 0.5 ? 'rock' : 'pillar'
    });
  }
}

// 새로운 방 입장 처리
function enterRoom(roomType, enteredFromSide) {
  roomState.type = roomType;
  roomState.cleared = false;
  roomState.monsters = [];
  roomState.boss = null;
  roomState.spellbook = null;
  roomState.projectiles = [];
  roomState.enemyProjectiles = [];
  roomState.particles = [];
  roomState.floatingTexts = [];
  roomState.obstacles = [];

  // 양피지 바닥의 잔디/돌 티끌 장식 생성
  roomState.floorDetails = [];
  for (let i = 0; i < 18; i++) {
    roomState.floorDetails.push({
      x: 70 + Math.random() * (CONFIG.CANVAS_WIDTH - 140),
      y: 80 + Math.random() * (CONFIG.CANVAS_HEIGHT - 160),
      w: 4 + Math.random() * 6
    });
  }

  // 플레이어 입장 위치 설정
  if (enteredFromSide === 'top') {
    player.x = CONFIG.CANVAS_WIDTH / 2;
    player.y = CONFIG.CANVAS_HEIGHT - 105;
  } else if (enteredFromSide === 'left') {
    player.x = CONFIG.CANVAS_WIDTH - 115;
    player.y = CONFIG.CANVAS_HEIGHT / 2;
  } else if (enteredFromSide === 'right') {
    player.x = 115;
    player.y = CONFIG.CANVAS_HEIGHT / 2;
  } else {
    player.x = CONFIG.CANVAS_WIDTH / 2;
    player.y = CONFIG.CANVAS_HEIGHT / 2 + 60;
  }

  // 다음 이동 문(위, 왼쪽, 오른쪽) 준비
  roomState.doors = [
    { ...getDoorRect('top'), nextType: 'COMBAT', label: '⚔️ 전투 방' },
    { ...getDoorRect('left'), nextType: 'COMBAT', label: '⚔️ 전투 방' },
    { ...getDoorRect('right'), nextType: 'COMBAT', label: '⚔️ 전투 방' }
  ];

  if (roomType === 'COMBAT') {
    generateObstacles(false);

    // 3~7마리 몬스터 수 결정
    const mCount = Math.floor(
      Math.random() * (CONFIG.MONSTER_COUNT_MAX - CONFIG.MONSTER_COUNT_MIN + 1)
    ) + CONFIG.MONSTER_COUNT_MIN;

    const maxHp = CONFIG.MONSTER_BASE_HP
      + (roomState.stageM - 1) * CONFIG.MONSTER_HP_PER_SUBSTAGE
      + (roomState.stageN - 1) * CONFIG.MONSTER_HP_PER_STAGE;

    const safeGrid = buildSafeFloorGrid(28);
    // 안전 좌표를 무작위로 섞음
    for (let i = safeGrid.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [safeGrid[i], safeGrid[j]] = [safeGrid[j], safeGrid[i]];
    }

    for (let i = 0; i < mCount; i++) {
      let mx = CONFIG.CANVAS_WIDTH / 2;
      let my = 180;
      let placed = false;

      // 1차: 무작위 빈 공간 탐색
      for (let t = 0; t < 80; t++) {
        const tx = 110 + Math.random() * (CONFIG.CANVAS_WIDTH - 220);
        const ty = 110 + Math.random() * (CONFIG.CANVAS_HEIGHT - 220);
        if (circlesOverlap(tx, ty, 26, player.x, player.y, 130)) continue;
        if (roomState.obstacles.some(o => circlesOverlap(tx, ty, 26, o.x, o.y, o.radius + 14))) continue;
        if (roomState.monsters.some(m => circlesOverlap(tx, ty, 26, m.x, m.y, 44))) continue;
        mx = tx;
        my = ty;
        placed = true;
        break;
      }

      // 2차 폴백: 사전 검증된 안전 격자 좌표에서 100% 보장 스폰
      if (!placed && safeGrid.length > 0) {
        const spot = safeGrid[i % safeGrid.length];
        mx = spot.x;
        my = spot.y;
      }

      const el = ELEMENT_KEYS[Math.floor(Math.random() * ELEMENT_KEYS.length)];
      roomState.monsters.push({
        x: mx,
        y: my,
        radius: 26,
        element: el,
        hp: maxHp,
        maxHp: maxHp,
        speed: CONFIG.MONSTER_SPEED + (roomState.stageN - 1) * 10,
        bobPhase: Math.random() * Math.PI * 2,
        hitFlash: 0
      });
    }

    addFloatingText(
      CONFIG.CANVAS_WIDTH / 2,
      115,
      `스테이지 ${roomState.stageN}-${roomState.stageM} (${roomState.clearedInSubStage + 1}/${CONFIG.ROOMS_PER_SUBSTAGE}번 방)`,
      '#1e293b'
    );
  } else if (roomType === 'SPELLBOOK') {
    // 마법서 방에는 몬스터가 나오지 않으며, 보물상자와 마법서 배치
    roomState.cleared = true;
    const unlearned = ELEMENT_KEYS.filter(k => !player.unlockedElements.includes(k));
    const rewardEl = unlearned.length > 0
      ? unlearned[Math.floor(Math.random() * unlearned.length)]
      : ELEMENT_KEYS[Math.floor(Math.random() * ELEMENT_KEYS.length)];

    roomState.spellbook = {
      x: 730,
      y: 410,
      chestX: 745,
      chestY: 225,
      element: rewardEl,
      collected: false
    };

    // 마법서 방 이후 문은 모두 전투 방으로 개방
    roomState.doors.forEach(d => {
      d.nextType = 'COMBAT';
      d.label = '⚔️ 전투 방';
    });

    addFloatingText(CONFIG.CANVAS_WIDTH / 2, 115, '📖 고대의 마법서 방 (안전 구역)', '#6d28d9');
  } else if (roomType === 'BOSS') {
    generateObstacles(true);
    const bossMaxHp = CONFIG.BOSS_MAX_HP + (roomState.stageN - 1) * CONFIG.BOSS_HP_PER_STAGE;
    roomState.boss = {
      x: CONFIG.CANVAS_WIDTH / 2,
      y: 215,
      radius: 52,
      element: ELEMENT_KEYS[Math.floor(Math.random() * ELEMENT_KEYS.length)],
      hp: bossMaxHp,
      maxHp: bossMaxHp,
      speed: CONFIG.BOSS_SPEED + (roomState.stageN - 1) * 8,
      shotTimer: 1.2,
      elementShiftTimer: 6.0,
      walkPhase: 0,
      hitFlash: 0
    };
    addFloatingText(
      CONFIG.CANVAS_WIDTH / 2,
      115,
      `👑 스테이지 ${roomState.stageN}-5 보스 : 설산의 원소 예티!`,
      '#b91c1c'
    );
  }
}

// 방 클리어 판정 및 다음 문 설정
function onRoomCleared() {
  if (roomState.cleared) return;
  roomState.cleared = true;

  if (roomState.type === 'COMBAT') {
    roomState.totalCombatCleared += 1;
    roomState.clearedInSubStage += 1;

    // 5개 방을 모두 클리어했으면 M을 1 증가시키고 다음 방을 결정
    if (roomState.clearedInSubStage >= CONFIG.ROOMS_PER_SUBSTAGE) {
      roomState.clearedInSubStage = 0;
      roomState.stageM += 1;
    }

    // M이 5가 되었다면 보스 방 문 개방!
    if (roomState.stageM >= 5) {
      roomState.doors.forEach(d => {
        d.nextType = 'BOSS';
        d.label = `👑 ${roomState.stageN}-5 보스 방`;
      });
      addFloatingText(CONFIG.CANVAS_WIDTH / 2, 140, `👑 ${roomState.stageN}-5 보스 방 문이 열렸습니다!`, '#b91c1c');
      return;
    }

    // 1~3번째 방을 깰 때마다 위·왼쪽·오른쪽 문 중 랜덤한 한 곳에 마법서 방 문 등장
    const currentRoomInSub = roomState.clearedInSubStage; // 1, 2, 3, 4
    roomState.doors.forEach(d => {
      d.nextType = 'COMBAT';
      d.label = '⚔️ 전투 방';
    });

    if (currentRoomInSub >= 1 && currentRoomInSub <= 3) {
      const randomIdx = Math.floor(Math.random() * roomState.doors.length);
      roomState.doors[randomIdx].nextType = 'SPELLBOOK';
      roomState.doors[randomIdx].label = '📖 마법서 방';
    }

    addFloatingText(CONFIG.CANVAS_WIDTH / 2, 140, '✨ 방 클리어! 문이 열렸습니다!', '#15803d');
  } else if (roomState.type === 'BOSS') {
    // 보스 처치 시 N은 1 증가하고 M은 1로 초기화!
    roomState.bossKills += 1;
    roomState.stageN += 1;
    roomState.stageM = 1;
    roomState.clearedInSubStage = 0;

    // 보스 격파 보상으로 체력 30 회복
    player.hp = Math.min(player.maxHp, player.hp + 30);

    roomState.doors.forEach(d => {
      d.nextType = 'COMBAT';
      d.label = `🚪 ${roomState.stageN}-1 다음 층`;
    });

    const nextTheme = getCurrentTheme();
    addFloatingText(
      CONFIG.CANVAS_WIDTH / 2,
      145,
      `🎉 보스 격파! ${roomState.stageN}-1 (${nextTheme.name}) 문 개방! (+HP 30)`,
      '#b45309'
    );
  }
}

// ============================================================================
// 플레이어 대쉬 및 마법 공격
// ============================================================================
function triggerDash() {
  let dx = 0;
  let dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

  if (dx === 0 && dy === 0) {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    dx = Math.cos(angle);
    dy = Math.sin(angle);
  } else {
    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;
  }

  player.dashDirX = dx;
  player.dashDirY = dy;
  player.dashTimer = CONFIG.DASH_DURATION;
  player.dashCooldownTimer = CONFIG.DASH_COOLDOWN;
  spawnParticles(player.x, player.y, '#ffffff', 10);
}

function tryPrimaryAttack() {
  if (player.primaryTimer > 0) return;
  player.primaryTimer = CONFIG.PRIMARY_COOLDOWN;

  const el = getCurrentElement();
  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  roomState.projectiles.push({
    x: player.x + Math.cos(angle) * 22,
    y: player.y + Math.sin(angle) * 22,
    vx: Math.cos(angle) * CONFIG.PRIMARY_SPEED,
    vy: Math.sin(angle) * CONFIG.PRIMARY_SPEED,
    radius: 8,
    damage: CONFIG.PRIMARY_DAMAGE,
    element: el,
    pierce: false,
    life: 1.6
  });
}

function trySkillAttack() {
  if (player.skillTimer > 0) return;
  player.skillTimer = CONFIG.SKILL_COOLDOWN;

  const el = getCurrentElement();
  const baseAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  if (el === 'water') {
    // 물 스킬: 관통 대형 해일탄
    roomState.projectiles.push({
      x: player.x + Math.cos(baseAngle) * 26,
      y: player.y + Math.sin(baseAngle) * 26,
      vx: Math.cos(baseAngle) * 440,
      vy: Math.sin(baseAngle) * 440,
      radius: 18,
      damage: CONFIG.SKILL_BASE_DAMAGE,
      element: 'water',
      pierce: true,
      hitIds: new Set(),
      life: 1.8
    });
  } else if (el === 'fire') {
    // 불 스킬: 5발 부채꼴 화염탄
    for (let i = -2; i <= 2; i++) {
      const a = baseAngle + i * 0.16;
      roomState.projectiles.push({
        x: player.x + Math.cos(a) * 24,
        y: player.y + Math.sin(a) * 24,
        vx: Math.cos(a) * 480,
        vy: Math.sin(a) * 480,
        radius: 10,
        damage: Math.round(CONFIG.SKILL_BASE_DAMAGE * 0.65),
        element: 'fire',
        pierce: false,
        life: 1.3
      });
    }
  } else if (el === 'lightning') {
    // 번개 스킬: 초고속 2연발 번개창
    for (let i = 0; i < 2; i++) {
      const offset = (i === 0 ? -1 : 1) * 10;
      const perp = baseAngle + Math.PI / 2;
      roomState.projectiles.push({
        x: player.x + Math.cos(perp) * offset,
        y: player.y + Math.sin(perp) * offset,
        vx: Math.cos(baseAngle) * 760,
        vy: Math.sin(baseAngle) * 760,
        radius: 9,
        damage: Math.round(CONFIG.SKILL_BASE_DAMAGE * 0.85),
        element: 'lightning',
        pierce: true,
        hitIds: new Set(),
        life: 1.1
      });
    }
  } else if (el === 'grass') {
    // 풀 스킬: 전방위 8방향 가시폭풍
    for (let i = 0; i < 8; i++) {
      const a = baseAngle + (Math.PI * 2 * i) / 8;
      roomState.projectiles.push({
        x: player.x + Math.cos(a) * 24,
        y: player.y + Math.sin(a) * 24,
        vx: Math.cos(a) * 430,
        vy: Math.sin(a) * 430,
        radius: 10,
        damage: Math.round(CONFIG.SKILL_BASE_DAMAGE * 0.75),
        element: 'grass',
        pierce: false,
        life: 1.2
      });
    }
  } else if (el === 'rock') {
    // 바위 스킬: 거대 룬 바위탄
    roomState.projectiles.push({
      x: player.x + Math.cos(baseAngle) * 28,
      y: player.y + Math.sin(baseAngle) * 28,
      vx: Math.cos(baseAngle) * 360,
      vy: Math.sin(baseAngle) * 360,
      radius: 22,
      damage: Math.round(CONFIG.SKILL_BASE_DAMAGE * 1.45),
      element: 'rock',
      pierce: false,
      life: 1.8
    });
  }
}

// 원형 엔티티와 장애물/벽 충돌 해결
function resolveCollisions(entity) {
  const minX = CONFIG.WALL_THICKNESS + entity.radius;
  const maxX = CONFIG.CANVAS_WIDTH - CONFIG.WALL_THICKNESS - entity.radius;
  const minY = CONFIG.WALL_THICKNESS + entity.radius;
  const maxY = CONFIG.CANVAS_HEIGHT - CONFIG.WALL_THICKNESS - entity.radius;

  entity.x = Math.max(minX, Math.min(maxX, entity.x));
  entity.y = Math.max(minY, Math.min(maxY, entity.y));

  for (const obs of roomState.obstacles) {
    const dx = entity.x - obs.x;
    const dy = entity.y - obs.y;
    const dist = Math.hypot(dx, dy);
    const minDist = entity.radius + obs.radius;
    if (dist < minDist && dist > 0.001) {
      const push = minDist - dist;
      entity.x += (dx / dist) * push;
      entity.y += (dy / dist) * push;
    }
  }
}

function damagePlayer(amount) {
  if (player.invulnTimer > 0 || player.dashTimer > 0 || gameState !== 'PLAYING') return;
  player.hp = Math.max(0, player.hp - amount);
  player.invulnTimer = CONFIG.INVULN_AFTER_HIT;
  addFloatingText(player.x, player.y - 34, `-${amount}`, '#dc2626');
  spawnParticles(player.x, player.y, '#ef4444', 12);

  if (player.hp <= 0) {
    gameState = 'GAMEOVER';
    endTitle.textContent = '💀 마법사가 쓰러졌습니다...';
    endSubtitle.textContent = `도달 스테이지: ${roomState.stageN}-${roomState.stageM} (${getCurrentTheme().name})`;
    resultStats.innerHTML = `
      <div>🚩 최종 도달 스테이지 : <b>${roomState.stageN}-${roomState.stageM}</b></div>
      <div>⚔️ 돌파한 일반 방 수 : <b>${roomState.totalCombatCleared}개</b></div>
      <div>👾 처치한 몬스터 : <b>${roomState.totalKills}마리</b> (보스 <b>${roomState.bossKills}회</b>)</div>
      <div>📖 습득한 마법 속성 : <b>${player.unlockedElements.map(e => ELEMENTS[e].icon + ELEMENTS[e].name).join(', ')}</b></div>
    `;
    endScreen.classList.remove('hidden');
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 160;
    roomState.particles.push({
      x,
      y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      radius: 3 + Math.random() * 3,
      color,
      life: 0.35 + Math.random() * 0.25
    });
  }
}

function addFloatingText(x, y, text, color) {
  roomState.floatingTexts.push({
    x,
    y,
    text,
    color,
    life: 1.05
  });
}

// ============================================================================
// 매 프레임 업데이트 로직
// ============================================================================
function update(dt) {
  if (gameState !== 'PLAYING') return;

  // 쿨타임 감소
  if (player.primaryTimer > 0) player.primaryTimer -= dt;
  if (player.skillTimer > 0) player.skillTimer -= dt;
  if (player.dashCooldownTimer > 0) player.dashCooldownTimer -= dt;
  if (player.invulnTimer > 0) player.invulnTimer -= dt;

  if (mouse.leftDown && player.primaryTimer <= 0) {
    tryPrimaryAttack();
  }

  // 플레이어 이동 처리
  if (player.dashTimer > 0) {
    player.dashTimer -= dt;
    player.x += player.dashDirX * CONFIG.DASH_SPEED * dt;
    player.y += player.dashDirY * CONFIG.DASH_SPEED * dt;
  } else {
    let mx = 0;
    let my = 0;
    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;

    if (mx !== 0 || my !== 0) {
      const len = Math.hypot(mx, my);
      mx /= len;
      my /= len;
      player.x += mx * CONFIG.PLAYER_SPEED * dt;
      player.y += my * CONFIG.PLAYER_SPEED * dt;
      player.walkAnim += dt * 11;
    }
  }
  resolveCollisions(player);

  // 마법서 방 상호작용 (다가가면 마법서 습득)
  if (roomState.type === 'SPELLBOOK' && roomState.spellbook && !roomState.spellbook.collected) {
    const sb = roomState.spellbook;
    if (circlesOverlap(player.x, player.y, player.radius + 14, sb.x, sb.y, 34)) {
      sb.collected = true;
      const elObj = ELEMENTS[sb.element];
      if (!player.unlockedElements.includes(sb.element)) {
        player.unlockedElements.push(sb.element);
        player.currentSlotIndex = player.unlockedElements.length - 1;
        addFloatingText(sb.x, sb.y - 40, `📖 ${elObj.icon} ${elObj.name} 마법서 습득! (E/Q 전환)`, elObj.color);
      } else {
        player.hp = Math.min(player.maxHp, player.hp + 25);
        addFloatingText(sb.x, sb.y - 40, `💖 마력 흡수! 체력 +25 회복!`, '#16a34a');
      }
      spawnParticles(sb.x, sb.y, elObj.color, 20);
    }
  }

  // 아군 투사체 업데이트 및 피격 판정
  for (let i = roomState.projectiles.length - 1; i >= 0; i--) {
    const p = roomState.projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    // 벽 또는 장애물 충돌 시 소멸
    if (
      p.life <= 0 ||
      p.x < CONFIG.WALL_THICKNESS ||
      p.x > CONFIG.CANVAS_WIDTH - CONFIG.WALL_THICKNESS ||
      p.y < CONFIG.WALL_THICKNESS ||
      p.y > CONFIG.CANVAS_HEIGHT - CONFIG.WALL_THICKNESS ||
      roomState.obstacles.some(o => circlesOverlap(p.x, p.y, p.radius * 0.7, o.x, o.y, o.radius))
    ) {
      spawnParticles(p.x, p.y, ELEMENTS[p.element].color, 5);
      roomState.projectiles.splice(i, 1);
      continue;
    }

    // 일반 몬스터 피격
    let consumed = false;
    for (let j = roomState.monsters.length - 1; j >= 0; j--) {
      const m = roomState.monsters[j];
      if (circlesOverlap(p.x, p.y, p.radius, m.x, m.y, m.radius)) {
        if (p.pierce && p.hitIds && p.hitIds.has(m)) continue;
        if (p.pierce && p.hitIds) p.hitIds.add(m);

        const mult = getElementMultiplier(p.element, m.element);
        const dmg = Math.round(p.damage * mult);
        m.hp -= dmg;
        m.hitFlash = 0.12;

        const tag = mult > 1 ? `약점! -${dmg}` : mult < 1 ? `내성 -${dmg}` : `-${dmg}`;
        const tagColor = mult > 1 ? '#d97706' : mult < 1 ? '#64748b' : '#111827';
        addFloatingText(m.x, m.y - 26, tag, tagColor);
        spawnParticles(p.x, p.y, ELEMENTS[p.element].color, 6);

        if (m.hp <= 0) {
          spawnParticles(m.x, m.y, ELEMENTS[m.element].color, 14);
          roomState.monsters.splice(j, 1);
          roomState.totalKills += 1;
        }

        if (!p.pierce) {
          consumed = true;
          break;
        }
      }
    }
    if (consumed) {
      roomState.projectiles.splice(i, 1);
      continue;
    }

    // 예티 보스 피격
    if (roomState.boss && circlesOverlap(p.x, p.y, p.radius, roomState.boss.x, roomState.boss.y, roomState.boss.radius)) {
      const b = roomState.boss;
      if (!(p.pierce && p.hitIds && p.hitIds.has(b))) {
        if (p.pierce && p.hitIds) p.hitIds.add(b);
        const mult = getElementMultiplier(p.element, b.element);
        const dmg = Math.round(p.damage * mult);
        b.hp -= dmg;
        b.hitFlash = 0.12;

        const tag = mult > 1 ? `약점! -${dmg}` : mult < 1 ? `내성 -${dmg}` : `-${dmg}`;
        const tagColor = mult > 1 ? '#d97706' : mult < 1 ? '#64748b' : '#111827';
        addFloatingText(b.x, b.y - 54, tag, tagColor);
        spawnParticles(p.x, p.y, ELEMENTS[p.element].color, 8);

        if (b.hp <= 0) {
          spawnParticles(b.x, b.y, '#92400e', 30);
          roomState.boss = null;
          onRoomCleared();
        }
        if (!p.pierce) {
          roomState.projectiles.splice(i, 1);
        }
      }
    }
  }

  // 몬스터 AI 업데이트 (시야 내 플레이어 추적)
  for (const m of roomState.monsters) {
    m.bobPhase += dt * 6;
    if (m.hitFlash > 0) m.hitFlash -= dt;

    const dx = player.x - m.x;
    const dy = player.y - m.y;
    const dist = Math.hypot(dx, dy);

    if (dist < CONFIG.MONSTER_DETECT_RANGE && dist > 1) {
      m.x += (dx / dist) * m.speed * dt;
      m.y += (dy / dist) * m.speed * dt;
      resolveCollisions(m);
    }

    if (circlesOverlap(player.x, player.y, player.radius, m.x, m.y, m.radius)) {
      damagePlayer(CONFIG.MONSTER_CONTACT_DAMAGE);
    }
  }

  // 전투 방에서 모든 몬스터 처치 시 자동 클리어
  if (roomState.type === 'COMBAT' && !roomState.cleared && roomState.monsters.length === 0) {
    onRoomCleared();
  }

  // 예티 보스 AI 업데이트
  if (roomState.boss) {
    const b = roomState.boss;
    b.walkPhase += dt * 4;
    if (b.hitFlash > 0) b.hitFlash -= dt;

    const dx = player.x - b.x;
    const dy = player.y - b.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 1) {
      b.x += (dx / dist) * b.speed * dt;
      b.y += (dy / dist) * b.speed * dt;
      resolveCollisions(b);
    }

    if (circlesOverlap(player.x, player.y, player.radius, b.x, b.y, b.radius - 6)) {
      damagePlayer(CONFIG.BOSS_DAMAGE);
    }

    // 보스 주기적 원소 속성 변경
    b.elementShiftTimer -= dt;
    if (b.elementShiftTimer <= 0) {
      b.elementShiftTimer = 6.0;
      b.element = ELEMENT_KEYS[Math.floor(Math.random() * ELEMENT_KEYS.length)];
      const elObj = ELEMENTS[b.element];
      addFloatingText(b.x, b.y - 65, `보스 속성 변환: ${elObj.icon} ${elObj.name}!`, elObj.color);
    }

    // 보스 8방향 원소 탄막 발사
    b.shotTimer -= dt;
    if (b.shotTimer <= 0) {
      b.shotTimer = CONFIG.BOSS_SHOT_COOLDOWN;
      const baseA = Math.atan2(dy, dx);
      for (let k = 0; k < 8; k++) {
        const a = baseA + (Math.PI * 2 * k) / 8;
        roomState.enemyProjectiles.push({
          x: b.x + Math.cos(a) * 44,
          y: b.y + Math.sin(a) * 44,
          vx: Math.cos(a) * CONFIG.BOSS_BULLET_SPEED,
          vy: Math.sin(a) * CONFIG.BOSS_BULLET_SPEED,
          radius: 9,
          element: b.element,
          life: 3.2
        });
      }
    }
  }

  // 적 투사체 업데이트
  for (let i = roomState.enemyProjectiles.length - 1; i >= 0; i--) {
    const ep = roomState.enemyProjectiles[i];
    ep.x += ep.vx * dt;
    ep.y += ep.vy * dt;
    ep.life -= dt;

    if (
      ep.life <= 0 ||
      ep.x < CONFIG.WALL_THICKNESS ||
      ep.x > CONFIG.CANVAS_WIDTH - CONFIG.WALL_THICKNESS ||
      ep.y < CONFIG.WALL_THICKNESS ||
      ep.y > CONFIG.CANVAS_HEIGHT - CONFIG.WALL_THICKNESS ||
      roomState.obstacles.some(o => circlesOverlap(ep.x, ep.y, ep.radius * 0.7, o.x, o.y, o.radius))
    ) {
      roomState.enemyProjectiles.splice(i, 1);
      continue;
    }

    if (circlesOverlap(ep.x, ep.y, ep.radius, player.x, player.y, player.radius)) {
      damagePlayer(CONFIG.BOSS_DAMAGE);
      roomState.enemyProjectiles.splice(i, 1);
    }
  }

  // 문 개방 상태일 때 문 접촉 시 다음 방으로 이동
  if (roomState.cleared) {
    for (const d of roomState.doors) {
      if (
        player.x + player.radius > d.x - 8 &&
        player.x - player.radius < d.x + d.w + 8 &&
        player.y + player.radius > d.y - 8 &&
        player.y - player.radius < d.y + d.h + 8
      ) {
        enterRoom(d.nextType, d.side);
        break;
      }
    }
  }

  // 파티클 및 떠오르는 텍스트 업데이트
  for (let i = roomState.particles.length - 1; i >= 0; i--) {
    const pt = roomState.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) roomState.particles.splice(i, 1);
  }
  for (let i = roomState.floatingTexts.length - 1; i >= 0; i--) {
    const ft = roomState.floatingTexts[i];
    ft.y -= 28 * dt;
    ft.life -= dt;
    if (ft.life <= 0) roomState.floatingTexts.splice(i, 1);
  }
}

// ============================================================================
// 목업 스타일 기반 캔버스 그리기 (N 증가 시 배경 테마 전환 포함)
// ============================================================================
function render() {
  const w = CONFIG.CANVAS_WIDTH;
  const h = CONFIG.CANVAS_HEIGHT;
  const wall = CONFIG.WALL_THICKNESS;
  const theme = getCurrentTheme();

  ctx.clearRect(0, 0, w, h);

  // 1. 방 바닥 그리기 (보스 방은 석재 타일, 일반/마법서 방은 N 테마 바닥)
  if (roomState.type === 'BOSS') {
    const tileSize = 64;
    for (let gx = 0; gx < w; gx += tileSize) {
      for (let gy = 0; gy < h; gy += tileSize) {
        ctx.fillStyle = ((gx / tileSize + gy / tileSize) % 2 === 0) ? theme.bossTileA : theme.bossTileB;
        ctx.fillRect(gx, gy, tileSize, tileSize);
        ctx.strokeStyle = theme.bossLine;
        ctx.lineWidth = 2;
        ctx.strokeRect(gx, gy, tileSize, tileSize);
      }
    }
  } else {
    // 외곽 성벽 (테마별 색상)
    ctx.fillStyle = theme.wall;
    ctx.fillRect(0, 0, w, h);

    // 성벽 안쪽 테두리 음영
    ctx.strokeStyle = theme.wallInner;
    ctx.lineWidth = 4;
    ctx.strokeRect(wall - 2, wall - 2, w - (wall - 2) * 2, h - (wall - 2) * 2);

    // 내부 바닥 (N이 증가할 때마다 바뀌는 테마 색상)
    ctx.fillStyle = theme.floor;
    ctx.fillRect(wall, wall, w - wall * 2, h - wall * 2);

    // 바닥 문양 장식
    ctx.fillStyle = theme.floorDot;
    for (const d of roomState.floorDetails) {
      ctx.fillRect(d.x, d.y, d.w, 2);
    }
  }

  // 2. 위·왼쪽·오른쪽 나무 문 그리기
  for (const d of roomState.doors) {
    drawDoor(d, roomState.cleared);
  }

  // 3. 마법서 방의 보물상자 및 룬 마법서 그리기
  if (roomState.type === 'SPELLBOOK' && roomState.spellbook) {
    drawTreasureChest(roomState.spellbook.chestX, roomState.spellbook.chestY);
    if (!roomState.spellbook.collected) {
      drawSpellbook(roomState.spellbook.x, roomState.spellbook.y, roomState.spellbook.element);
    }
  }

  // 4. Y좌표 깊이 정렬로 장애물·몬스터·보스·플레이어 자연스럽게 그리기
  const renderables = [];
  for (const obs of roomState.obstacles) {
    renderables.push({ y: obs.y, draw: () => drawObstacle(obs) });
  }
  for (const m of roomState.monsters) {
    renderables.push({ y: m.y, draw: () => drawSlime(m) });
  }
  if (roomState.boss) {
    renderables.push({ y: roomState.boss.y, draw: () => drawYetiBoss(roomState.boss) });
  }
  renderables.push({ y: player.y, draw: () => drawStickWizard() });

  renderables.sort((a, b) => a.y - b.y);
  for (const item of renderables) {
    item.draw();
  }

  // 5. 투사체 및 이펙트 그리기
  for (const p of roomState.projectiles) {
    const elObj = ELEMENTS[p.element];
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = elObj.color;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.restore();
  }

  for (const ep of roomState.enemyProjectiles) {
    const elObj = ELEMENTS[ep.element];
    ctx.save();
    ctx.beginPath();
    ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
    ctx.fillStyle = elObj.color;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#1f2937';
    ctx.stroke();
    ctx.restore();
  }

  for (const pt of roomState.particles) {
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
    ctx.fillStyle = pt.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const ft of roomState.floatingTexts) {
    ctx.save();
    ctx.font = 'bold 16px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  // 6. 좌측 상단 목업 UI (HP바 + E [주속성] Q 3칸 슬롯) 및 우측 상단 스테이지(N-M) 표시
  drawMockupHUD();
}

// 나무 문 그리기
function drawDoor(d, isOpen) {
  ctx.save();
  ctx.fillStyle = isOpen ? '#8c5828' : '#593718';
  ctx.strokeStyle = '#2e1a09';
  ctx.lineWidth = 3;
  ctx.fillRect(d.x, d.y, d.w, d.h);
  ctx.strokeRect(d.x, d.y, d.w, d.h);

  // 문 판자 결
  ctx.beginPath();
  if (d.side === 'top') {
    ctx.moveTo(d.x + d.w / 2, d.y);
    ctx.lineTo(d.x + d.w / 2, d.y + d.h);
  } else {
    ctx.moveTo(d.x, d.y + d.h / 2);
    ctx.lineTo(d.x + d.w, d.y + d.h / 2);
  }
  ctx.strokeStyle = '#3d240e';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 문 손잡이
  ctx.beginPath();
  ctx.arc(d.x + d.w * 0.72, d.y + d.h * 0.55, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = isOpen ? '#fbbf24' : '#1f2937';
  ctx.fill();

  // 문 개방 시 안내 라벨 표시
  if (isOpen) {
    ctx.font = 'bold 13px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    const lx = d.side === 'top' ? d.x + d.w / 2 : (d.side === 'left' ? d.x + d.w + 48 : d.x - 48);
    const ly = d.side === 'top' ? d.y + d.h + 18 : d.y + d.h / 2 + 4;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.strokeText(d.label, lx, ly);
    ctx.fillStyle = d.nextType === 'BOSS' ? '#b91c1c' : (d.nextType === 'SPELLBOOK' ? '#6d28d9' : '#1e293b');
    ctx.fillText(d.label, lx, ly);
  }
  ctx.restore();
}

// 고대 석주/바위 장애물 그리기
function drawObstacle(obs) {
  ctx.save();
  // 바닥 그림자
  ctx.beginPath();
  ctx.ellipse(obs.x, obs.y + obs.radius * 0.75, obs.radius * 0.95, obs.radius * 0.42, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fill();

  if (obs.kind === 'pillar') {
    // 고대 석주 기둥
    ctx.fillStyle = '#8b9296';
    ctx.strokeStyle = '#3f4447';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(obs.x - obs.radius * 0.72, obs.y - obs.radius * 1.15, obs.radius * 1.44, obs.radius * 1.85, 6);
    ctx.fill();
    ctx.stroke();

    // 상단 석판
    ctx.fillStyle = '#a6aeb3';
    ctx.fillRect(obs.x - obs.radius * 0.85, obs.y - obs.radius * 1.25, obs.radius * 1.7, 12);
    ctx.strokeRect(obs.x - obs.radius * 0.85, obs.y - obs.radius * 1.25, obs.radius * 1.7, 12);
  } else {
    // 둥근 고대 바위
    ctx.fillStyle = '#7e8487';
    ctx.strokeStyle = '#3b3f42';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(obs.x, obs.y - 4, obs.radius * 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 바위 하이라이트
    ctx.beginPath();
    ctx.arc(obs.x - obs.radius * 0.28, obs.y - obs.radius * 0.35, obs.radius * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
  }
  ctx.restore();
}

// 뾰족한 마법사 모자와 지팡이를 든 스틱맨 마법사 그리기
function drawStickWizard() {
  ctx.save();
  const x = player.x;
  const y = player.y;
  const elObj = ELEMENTS[getCurrentElement()];

  // 무적 점멸 효과
  if (player.invulnTimer > 0 && Math.floor(player.invulnTimer * 18) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }

  // 그림자
  ctx.beginPath();
  ctx.ellipse(x, y + 22, 16, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fill();

  const walkSwing = Math.sin(player.walkAnim) * 5;

  // 몸통 & 팔다리 (스틱맨 스타일)
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';

  // 몸통
  ctx.beginPath();
  ctx.moveTo(x, y - 6);
  ctx.lineTo(x, y + 11);
  // 다리
  ctx.moveTo(x, y + 11);
  ctx.lineTo(x - 8, y + 21 + walkSwing * 0.4);
  ctx.moveTo(x, y + 11);
  ctx.lineTo(x + 8, y + 21 - walkSwing * 0.4);
  // 왼팔
  ctx.moveTo(x, y - 1);
  ctx.lineTo(x - 11, y + 7);
  // 오른팔 (지팡이 잡는 팔)
  ctx.moveTo(x, y - 1);
  ctx.lineTo(x + 12, y + 4);
  ctx.stroke();

  // 나무 마법 지팡이 & 끝부분 원소 보석 빛
  ctx.beginPath();
  ctx.moveTo(x + 14, y + 21);
  ctx.lineTo(x + 16, y - 14);
  ctx.strokeStyle = '#6b4226';
  ctx.lineWidth = 3.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x + 16, y - 16, 5, 0, Math.PI * 2);
  ctx.fillStyle = elObj.color;
  ctx.fill();

  // 머리 (동그라미)
  ctx.beginPath();
  ctx.arc(x, y - 14, 9, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#1e1e1e';
  ctx.lineWidth = 2.8;
  ctx.stroke();

  // 뾰족한 마법사 모자
  ctx.fillStyle = '#27292e';
  ctx.strokeStyle = '#111214';
  ctx.lineWidth = 2.2;
  // 모자 챙
  ctx.beginPath();
  ctx.ellipse(x, y - 21, 16, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // 모자 고깔
  ctx.beginPath();
  ctx.moveTo(x - 10, y - 21);
  ctx.lineTo(x + 2, y - 41);
  ctx.lineTo(x + 10, y - 21);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

// 표정이 있는 젤리 슬라임 몬스터 그리기
function drawSlime(m) {
  ctx.save();
  const elObj = ELEMENTS[m.element];
  const squish = Math.sin(m.bobPhase) * 2.5;

  // 바닥 그림자
  ctx.beginPath();
  ctx.ellipse(m.x, m.y + 20, m.radius * 0.95, 7, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fill();

  // 슬라임 몸체
  ctx.beginPath();
  ctx.moveTo(m.x - m.radius - squish, m.y + 16);
  ctx.bezierCurveTo(
    m.x - m.radius, m.y - m.radius * 1.1 + squish,
    m.x + m.radius, m.y - m.radius * 1.1 + squish,
    m.x + m.radius + squish, m.y + 16
  );
  ctx.closePath();
  ctx.fillStyle = m.hitFlash > 0 ? '#ffffff' : elObj.lightColor;
  ctx.fill();
  ctx.lineWidth = 2.8;
  ctx.strokeStyle = elObj.color;
  ctx.stroke();

  // 귀여운 눈과 입
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.arc(m.x - 7, m.y - 2, 3.2, 0, Math.PI * 2);
  ctx.arc(m.x + 7, m.y - 2, 3.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(m.x, m.y + 4, 4, 0, Math.PI);
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 머리 위 속성 아이콘 & 체력바
  ctx.font = '15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(elObj.icon, m.x, m.y - 34);

  const barW = 42;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(m.x - barW / 2, m.y - 28, barW, 5);
  ctx.fillStyle = elObj.color;
  ctx.fillRect(m.x - barW / 2, m.y - 28, barW * Math.max(0, m.hp / m.maxHp), 5);

  ctx.restore();
}

// 6번째 방(N-5)의 거대 갈색 예티 보스 그리기
function drawYetiBoss(b) {
  ctx.save();
  const elObj = ELEMENTS[b.element];
  const bob = Math.sin(b.walkPhase) * 3;

  // 거대 그림자
  ctx.beginPath();
  ctx.ellipse(b.x, b.y + 52, 48, 13, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fill();

  ctx.fillStyle = b.hitFlash > 0 ? '#ffffff' : '#784b2a';
  ctx.strokeStyle = '#3b210e';
  ctx.lineWidth = 3.5;

  // 양팔
  ctx.beginPath();
  ctx.roundRect(b.x - 58, b.y - 18 + bob, 20, 46, 10);
  ctx.roundRect(b.x + 38, b.y - 18 - bob, 20, 46, 10);
  ctx.fill();
  ctx.stroke();

  // 양다리
  ctx.beginPath();
  ctx.roundRect(b.x - 28, b.y + 24, 20, 28, 8);
  ctx.roundRect(b.x + 8, b.y + 24, 20, 28, 8);
  ctx.fill();
  ctx.stroke();

  // 거대한 털북숭이 몸통
  ctx.beginPath();
  ctx.ellipse(b.x, b.y + 2, 40, 38, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 머리
  ctx.beginPath();
  ctx.arc(b.x, b.y - 34, 24, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 얼굴 표정
  ctx.fillStyle = '#d6b293';
  ctx.beginPath();
  ctx.ellipse(b.x, b.y - 31, 16, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#111827';
  ctx.beginPath();
  ctx.arc(b.x - 6, b.y - 34, 2.8, 0, Math.PI * 2);
  ctx.arc(b.x + 6, b.y - 34, 2.8, 0, Math.PI * 2);
  ctx.fill();

  // 보스 속성 오라 및 머리 위 체력바
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${elObj.icon} 원소 예티 보스`, b.x, b.y - 74);

  const barW = 110;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(b.x - barW / 2, b.y - 66, barW, 9);
  ctx.fillStyle = elObj.color;
  ctx.fillRect(b.x - barW / 2, b.y - 66, barW * Math.max(0, b.hp / b.maxHp), 9);

  ctx.restore();
}

// 열린 보물상자 그리기 (목업 1 반영)
function drawTreasureChest(x, y) {
  ctx.save();
  ctx.fillStyle = '#8b5a2b';
  ctx.strokeStyle = '#3b230e';
  ctx.lineWidth = 3;
  // 상자 본체
  ctx.fillRect(x - 36, y - 16, 72, 44);
  ctx.strokeRect(x - 36, y - 16, 72, 44);
  // 열린 뚜껑
  ctx.fillStyle = '#a06a35';
  ctx.fillRect(x - 38, y - 38, 76, 22);
  ctx.strokeRect(x - 38, y - 38, 76, 22);
  // 금속 자물쇠
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(x - 8, y - 12, 16, 16);
  ctx.strokeRect(x - 8, y - 12, 16, 16);
  ctx.restore();
}

// 보라색 룬 마법서 그리기 (목업 1 반영)
function drawSpellbook(x, y, element) {
  ctx.save();
  const elObj = ELEMENTS[element];
  const floatY = y + Math.sin(performance.now() * 0.005) * 4;

  // 마법 빛 후광
  ctx.beginPath();
  ctx.arc(x, floatY, 34, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(139, 92, 246, 0.22)';
  ctx.fill();

  // 책 표지
  ctx.fillStyle = '#583b6e';
  ctx.strokeStyle = '#281836';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(x - 22, floatY - 28, 44, 56, 5);
  ctx.fill();
  ctx.stroke();

  // 금장 모서리
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(x + 12, floatY - 28, 10, 10);
  ctx.fillRect(x + 12, floatY + 18, 10, 10);

  // 중앙 속성 아이콘
  ctx.font = '24px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(elObj.icon, x, floatY + 9);

  ctx.font = 'bold 13px "Malgun Gothic", sans-serif';
  ctx.fillStyle = '#4c1d95';
  ctx.fillText(`📖 ${elObj.name} 마법서`, x, floatY - 36);
  ctx.restore();
}

// 좌측 상단 목업 UI (HP바 + E [주속성] Q 3칸 슬롯) 및 우측 상단 스테이지(N-M) 표시
function drawMockupHUD() {
  ctx.save();

  // 1. 좌측 상단 초록 HP 바 (100/100)
  const hpX = 24;
  const hpY = 14;
  const hpW = 165;
  const hpH = 22;
  ctx.fillStyle = '#1f2937';
  ctx.beginPath();
  ctx.roundRect(hpX, hpY, hpW, hpH, 11);
  ctx.fill();

  const ratio = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = '#22c55e';
  ctx.beginPath();
  ctx.roundRect(hpX + 2, hpY + 2, (hpW - 4) * ratio, hpH - 4, 9);
  ctx.fill();

  ctx.font = 'bold 13px "Malgun Gothic", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.fillText(`${player.hp}/${player.maxHp}`, hpX + hpW / 2, hpY + 16);

  // 2. 좌측 상단 E [현재 주속성] Q 3칸 마법 슬롯
  const len = player.unlockedElements.length;
  const curIdx = player.currentSlotIndex;
  const prevIdx = (curIdx - 1 + len) % len;
  const nextIdx = (curIdx + 1) % len;

  const prevEl = ELEMENTS[player.unlockedElements[prevIdx]];
  const curEl = ELEMENTS[player.unlockedElements[curIdx]];
  const nextEl = ELEMENTS[player.unlockedElements[nextIdx]];

  // 왼쪽 E 슬롯
  drawSlotBox(28, 48, 44, 44, prevEl, 'E', false);
  // 중앙 주속성 슬롯 (크게 강조)
  drawSlotBox(78, 42, 56, 56, curEl, '', true);
  // 오른쪽 Q 슬롯
  drawSlotBox(140, 48, 44, 44, nextEl, 'Q', false);

  // 우클릭 스킬 및 대쉬 쿨타임 상태 미니 표시
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px "Malgun Gothic", sans-serif';
  ctx.fillStyle = '#1e293b';
  const skillReady = player.skillTimer <= 0 ? '준비 완료!' : `${player.skillTimer.toFixed(1)}초`;
  const dashReady = player.dashCooldownTimer <= 0 ? '준비 완료!' : `${player.dashCooldownTimer.toFixed(1)}초`;
  ctx.fillText(`우클릭(${curEl.skillName}): ${skillReady}  |  대쉬(Space): ${dashReady}`, 208, 29);

  // 3. 우측 상단 스테이지 N-M 및 테마 안내 배지
  const theme = getCurrentTheme();
  const stageText = `스테이지 ${roomState.stageN}-${roomState.stageM}  (${theme.name})`;
  const subText = roomState.stageM >= 5
    ? '👑 보스 결전 스테이지!'
    : `다음 단계까지 방 ${roomState.clearedInSubStage} / ${CONFIG.ROOMS_PER_SUBSTAGE}`;

  ctx.fillStyle = 'rgba(24, 26, 32, 0.82)';
  ctx.beginPath();
  ctx.roundRect(CONFIG.CANVAS_WIDTH - 295, 12, 275, 50, 10);
  ctx.fill();

  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 15px "Malgun Gothic", sans-serif';
  ctx.fillText(stageText, CONFIG.CANVAS_WIDTH - 32, 33);

  ctx.fillStyle = '#e2e8f0';
  ctx.font = '12px "Malgun Gothic", sans-serif';
  ctx.fillText(subText, CONFIG.CANVAS_WIDTH - 32, 52);

  ctx.restore();
}

function drawSlotBox(x, y, w, h, elObj, keyLabel, isMain) {
  ctx.save();
  ctx.fillStyle = isMain ? '#374151' : '#4b5563';
  ctx.strokeStyle = isMain ? '#ffd166' : '#1f2937';
  ctx.lineWidth = isMain ? 3 : 2;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 6);
  ctx.fill();
  ctx.stroke();

  ctx.font = isMain ? '28px sans-serif' : '21px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(elObj.icon, x + w / 2, y + h * 0.7);

  if (keyLabel) {
    ctx.font = 'bold 14px "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#111827';
    ctx.fillText(keyLabel, x + w / 2, y + h + 16);
  }
  ctx.restore();
}

// ============================================================================
// 메인 게임 루프
// ============================================================================
function gameLoop(timestamp) {
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000 || 0);
  lastTime = timestamp;

  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
